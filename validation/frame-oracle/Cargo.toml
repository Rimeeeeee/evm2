[package]
name = "evm2-frame-oracle"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
evm2 = { path = "../../crates/evm2", default-features = false, features = ["std", "parse"] }
revm = { git = "https://github.com/Soubhik-10/revm", rev = "b2109aeb7a69505617c629538e9014bd20148e5c", default-features = false, features = ["std"] }
alloy-consensus = { version = "=2.4.1", default-features = false }
alloy-eips = { version = "=2.4.1", default-features = false }
alloy-primitives = { version = "1.7.3", default-features = false, features = ["std"] }

[profile.dev]
opt-level = 3

[patch.crates-io]
# Bogota devnet 1
alloy-consensus = { git = "https://github.com/Rimeeeeee/alloy", rev = "1ff4bf799bc78b0913561fa3e44bc65d0444c638" }
alloy-consensus-any = { git = "https://github.com/Rimeeeeee/alloy", rev = "1ff4bf799bc78b0913561fa3e44bc65d0444c638" }
alloy-contract = { git = "https://github.com/Rimeeeeee/alloy", rev = "1ff4bf799bc78b0913561fa3e44bc65d0444c638" }
alloy-eips = { git = "https://github.com/Rimeeeeee/alloy", rev = "1ff4bf799bc78b0913561fa3e44bc65d0444c638" }
alloy-genesis = { git = "https://github.com/Rimeeeeee/alloy", rev = "1ff4bf799bc78b0913561fa3e44bc65d0444c638" }
alloy-json-rpc = { git = "https://github.com/Rimeeeeee/alloy", rev = "1ff4bf799bc78b0913561fa3e44bc65d0444c638" }
alloy-network = { git = "https://github.com/Rimeeeeee/alloy", rev = "1ff4bf799bc78b0913561fa3e44bc65d0444c638" }
alloy-network-primitives = { git = "https://github.com/Rimeeeeee/alloy", rev = "1ff4bf799bc78b0913561fa3e44bc65d0444c638" }
alloy-provider = { git = "https://github.com/Rimeeeeee/alloy", rev = "1ff4bf799bc78b0913561fa3e44bc65d0444c638" }
alloy-pubsub = { git = "https://github.com/Rimeeeeee/alloy", rev = "1ff4bf799bc78b0913561fa3e44bc65d0444c638" }
alloy-rpc-client = { git = "https://github.com/Rimeeeeee/alloy", rev = "1ff4bf799bc78b0913561fa3e44bc65d0444c638" }
alloy-rpc-types-eth = { git = "https://github.com/Rimeeeeee/alloy", rev = "1ff4bf799bc78b0913561fa3e44bc65d0444c638" }
alloy-rpc-types-trace = { git = "https://github.com/Rimeeeeee/alloy", rev = "1ff4bf799bc78b0913561fa3e44bc65d0444c638" }
alloy-serde = { git = "https://github.com/Rimeeeeee/alloy", rev = "1ff4bf799bc78b0913561fa3e44bc65d0444c638" }
alloy-signer = { git = "https://github.com/Rimeeeeee/alloy", rev = "1ff4bf799bc78b0913561fa3e44bc65d0444c638" }
alloy-transport = { git = "https://github.com/Rimeeeeee/alloy", rev = "1ff4bf799bc78b0913561fa3e44bc65d0444c638" }
alloy-transport-http = { git = "https://github.com/Rimeeeeee/alloy", rev = "1ff4bf799bc78b0913561fa3e44bc65d0444c638" }
alloy-tx-macros = { git = "https://github.com/Rimeeeeee/alloy", rev = "1ff4bf799bc78b0913561fa3e44bc65d0444c638" }

# faster compile times: https://github.com/arkworks-rs/algebra/issues/1104
ark-ec = { git = "https://github.com/DaniPopes/algebra", rev = "a71d9795e2e527cd0c80e6831bd957134de30d22" }
ark-bls12-381 = { git = "https://github.com/DaniPopes/algebra", rev = "a71d9795e2e527cd0c80e6831bd957134de30d22" }
ark-bn254 = { git = "https://github.com/DaniPopes/algebra", rev = "a71d9795e2e527cd0c80e6831bd957134de30d22" }
ark-ff = { git = "https://github.com/DaniPopes/algebra", rev = "a71d9795e2e527cd0c80e6831bd957134de30d22" }
ark-ff-asm = { git = "https://github.com/DaniPopes/algebra", rev = "a71d9795e2e527cd0c80e6831bd957134de30d22" }
ark-ff-macros = { git = "https://github.com/DaniPopes/algebra", rev = "a71d9795e2e527cd0c80e6831bd957134de30d22" }
ark-poly = { git = "https://github.com/DaniPopes/algebra", rev = "a71d9795e2e527cd0c80e6831bd957134de30d22" }
ark-serialize = { git = "https://github.com/DaniPopes/algebra", rev = "a71d9795e2e527cd0c80e6831bd957134de30d22" }
ark-serialize-derive = { git = "https://github.com/DaniPopes/algebra", rev = "a71d9795e2e527cd0c80e6831bd957134de30d22" }

# LLVM 23 support is not released yet.
inkwell = { git = "https://github.com/TheDan64/inkwell", rev = "c9d9734ae17dbaf1d9902dab3b8ee9d2041781ff" }
