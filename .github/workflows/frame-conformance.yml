name: Bogota frame conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frame-conformance-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  frame-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      EVM2_COMPILED_EEST_SUBSET: all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@2ab28a31ae569be9f780c7675b684471060afa40
        with:
          toolchain: nightly-2026-10-08
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install LLVM
        run: .github/scripts/install_llvm.sh ubuntu
      - name: Fetch the manifest-pinned corpus and verify its checksum
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, tomllib, urllib.request
          manifest = tomllib.loads(pathlib.Path("docs/frame-transactions-protocol.toml").read_text())
          pin = manifest["qualification"]
          tag = pin["fixture_release"].split(" ", 1)[1].replace("@", "%40")
          url = f"https://github.com/ethereum/execution-specs/releases/download/{tag}/{pin['fixture_archive']}"
          urllib.request.urlretrieve(url, "bogota-fixtures.tar.gz")
          PY
          python3 scripts/extract_bogota_fixtures.py bogota-fixtures.tar.gz test-fixtures/bogota
      - name: Every interpreter dispatch and the full official corpus
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p evm2-eest --bin frame-conformance
          for backend in auto tco packed single_return unpacked; do
            echo "Interpreter dispatch: $backend"
            EVM2_DISPATCH_BACKEND="$backend" target/debug/frame-conformance test-fixtures/bogota interpreter
          done
          target/debug/frame-conformance test-fixtures/bogota inspected
      - name: Native JIT and AOT with no opcode fallback
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -p evm2-eest --features jit --bin frame-conformance -- test-fixtures/bogota jit
          cargo run --locked -p evm2-eest --features jit --bin frame-conformance -- test-fixtures/bogota aot
          cargo test --locked -p evm2-jit-runtime --lib frame_tests -- --test-threads=1
      - name: Engine and inspected regressions
        run: |
          cargo test --locked -p evm2 --no-default-features --features std,parse,serde,async --lib --test frame_transactions
          cargo test --locked -p evm2-inspectors --no-default-features --features std --lib --test frame_transactions
          cargo check --locked -p evm2 --no-default-features
      - name: Pinned revm differential cases
        run: cargo run --locked --manifest-path validation/frame-oracle/Cargo.toml
